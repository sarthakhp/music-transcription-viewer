<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Transcribe music into pitch, chords and instruments, then practice with it.">

  <!-- Mobile: fill the whole screen (notch/home-indicator handled by Flutter
       safe areas), and disable browser page-zoom so two-finger pinch is
       delivered to the pitch graph instead of zooming the page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transcriber">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <style>
    /* Avoid a white flash before Flutter paints, and block pull-to-refresh /
       rubber-banding that would fight the graph's drag-to-pan gesture. */
    html, body { margin: 0; background: #000; overscroll-behavior: none; }
    @media (prefers-color-scheme: light) { html, body { background: #fff; } }
  </style>

  <title>Music Transcriber</title>
  <link rel="manifest" href="manifest.json">

  <!-- Forward browser console (incl. Flutter debugPrint) into launcher.log via
       pywebview's js_api, so DMG issues can be debugged with `tail -f
       launcher.log` instead of attaching Safari Web Inspector. No-op on plain
       web (window.pywebview never appears there) — messages just queue and
       are dropped. -->
  <script>
    (function () {
      var buffer = [];
      var flushed = false;
      function forward(level, args) {
        var msg = Array.prototype.map.call(args, function (a) {
          try { return typeof a === 'string' ? a : JSON.stringify(a); }
          catch (e) { return String(a); }
        }).join(' ');
        var line = level + ': ' + msg;
        if (window.pywebview && window.pywebview.api && window.pywebview.api.log_from_js) {
          window.pywebview.api.log_from_js(line);
        } else {
          buffer.push(line);
        }
      }
      ['log', 'warn', 'error'].forEach(function (level) {
        var orig = console[level];
        console[level] = function () {
          forward(level.toUpperCase(), arguments);
          return orig.apply(console, arguments);
        };
      });
      window.addEventListener('pywebviewready', function flush() {
        if (flushed) return;
        flushed = true;
        buffer.forEach(function (line) {
          try { window.pywebview.api.log_from_js(line); } catch (e) {}
        });
        buffer.length = 0;
      });
    })();
  </script>
</head>
<body>
  <!-- File-picker bridge: calls a local HTTP server (launcher.py) in the DMG,
       falls back to an HTML <input> in the browser/GitHub Pages build.
       The local server runs on port 47823 when inside the macOS DMG app. -->
  <script>
    // __pickFile is always callable from Dart. Returns a Promise that resolves to:
    //   {name, data}           — file picked via native OS dialog (DMG)
    //   null                   — user cancelled (DMG)
    //   {_unavailable: true}   — not in DMG; Dart falls back to HTML <input>
    window.__pickFile = function (hint) {
      return fetch('http://127.0.0.1:47823/pick-file?hint=' + encodeURIComponent(hint || 'audio'))
        .then(function (r) {
          if (!r.ok) throw new Error('picker ' + r.status);
          return r.json(); // null (cancelled) or {name, data}
        })
        .catch(function () {
          // Server not running (not in DMG) — signal Dart to use HTML input.
          return { _unavailable: true };
        });
    };
  </script>
  <!-- Expose SoundTouchNode globally for Dart js_interop bindings -->
  <script type="module">
    import { SoundTouchNode } from './SoundTouchNode.js';
    window.SoundTouchNode = SoundTouchNode;
  </script>
  <!-- MP3 encoder used by audio_exporter.js for instant client-side export -->
  <script src="lame.min.js"></script>
  <script type="module">
    import { exportMp3 } from './audio_exporter.js';
    window.audioExporter = { exportMp3 };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
