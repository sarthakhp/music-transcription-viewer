<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Music Transcriber">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Music Transcriber</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- pywebview bridge shim: exposes __pickFile and __inPywebview for Dart -->
  <script>
    // __pickFile is always callable from Dart. Returns:
    //   {name, data}           — file picked via pywebview native dialog
    //   null                   — user cancelled in pywebview
    //   {_unavailable: true}   — not in pywebview; Dart falls back to HTML input
    //
    // Using a return-value sentinel avoids relying on @JS boolean globals
    // which dart2js release builds don't read reliably from window.*.
    window.__pickFile = function (hint) {
      var pw = window.pywebview;
      if (pw && pw.api && pw.api.pick_file) {
        console.log('[bridge] calling pywebview.api.pick_file hint=', hint);
        return pw.api.pick_file(hint);
      }
      console.warn('[bridge] pywebview not available, signalling _unavailable');
      return Promise.resolve({_unavailable: true});
    };
    // Also expose a synchronous check function (called once on first pick attempt)
    window.__hasPywebview = function() {
      return !!(window.pywebview && window.pywebview.api);
    };
  </script>
  <!-- Expose SoundTouchNode globally for Dart js_interop bindings -->
  <script type="module">
    import { SoundTouchNode } from './SoundTouchNode.js';
    window.SoundTouchNode = SoundTouchNode;
  </script>
  <!-- MP3 encoder used by audio_exporter.js for instant client-side export -->
  <script src="lame.min.js"></script>
  <script type="module">
    import { exportMp3 } from './audio_exporter.js';
    window.audioExporter = { exportMp3 };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
